<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/x-icon" href="logos\X.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Nexo - Login</title>
</head>
<body>

    <section id="login" class="section">
        <div class="login-wrapper">
            <div class="login-container">

                <!-- Painel esquerdo: identidade da marca -->
                <div class="login-banner">
                    <div class="brand-logo">
                        <img src="logos\nexo-branco.png" alt="Nexo" style="width: 300px; height: auto;">
                    </div>
                    <div class="banner-divider"></div>
                    <h2>Bem-vindo de volta!</h2>
                    <p>Acesse sua conta e conecte-se a quem realmente entrega resultados.</p>
                </div>

                <!-- Painel direito: formulário de login -->
                <div class="login-card">
                    <form id="form-login" action="#" method="post" class="form-login">
                        <h1>Entrar</h1>
                        <p class="subtitulo">Acesse sua conta Nexo</p>

                        <div class="campo">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                        </div>

                        <div class="campo">
                            <div class="campo-senha-header">
                                <label for="senha">Senha</label>
                                <a href="recuperar-senha.html" class="link-esqueci">Esqueceu a senha?</a>
                            </div>
                            <div class="input-senha-wrapper">
                                <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                                <button type="button" class="toggle-senha" onclick="toggleSenha()" aria-label="Mostrar ou ocultar senha">
                                    <svg id="icone-senha" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="button-acesso">Entrar</button>

                        <div class="divisor">ou continue com</div>

                        <a href="#" class="botao-google">
                            <svg viewBox="0 0 48 48" width="20" height="20">
                                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                                <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                            </svg>
                            Continuar com Google
                        </a>

                        <p class="cadastro-link">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
                    </form>
                </div>

            </div>
        </div>
    </section>

    <script src="login.js"></script>

</body>
</html>
